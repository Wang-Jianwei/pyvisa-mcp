[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pyvisa-mcp"
version = "0.1.0"
description = "PyVISA-backed MCP server for instrument control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Wang-Jianwei" }
]
dependencies = [
  "mcp[cli]>=1.0.0",
  "pyvisa>=1.14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
sim = [
  "pyvisa-sim>=0.7.0"
]

[project.scripts]
pyvisa-mcp = "pyvisa_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
